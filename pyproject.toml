[project]
name = "movie-assistant"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "flask>=3.0",
    "openai>=1.40",
    "google-genai>=1.0",
    "pydantic-ai>=0.0.13",
    "faiss-cpu>=1.8",
    "sentence-transformers>=3.0",
    "psycopg2-binary>=2.9",
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "python-dotenv>=1.0",
    "requests>=2.32",
    "gunicorn>=22.0",
    "streamlit>=1.35",
    "tqdm>=4.66",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
required-environments = [
    "sys_platform == 'linux'",
    "sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
]

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu", marker = "platform_machine == 'x86_64' and sys_platform == 'darwin'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
dev = [
    "jupyter>=1.0",
    "ipykernel>=6.0",
]
